name: Build and publish Docker image to GHCR

on:
  push:
    branches:
      - master
      - prod-safe
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lolosoftware/rustdesk-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Build RustDesk Web Client V2
        shell: bash
        run: |
          rm -rf rustdesk-web-v2 resources/web2
          git clone --depth 1 https://github.com/rustdesk/rustdesk.git rustdesk-web-v2
          cd rustdesk-web-v2
          git fetch --depth 1 origin 03a7fc5992069cc5bc9f7c36b872483dddf4f472
          git checkout --detach 03a7fc5992069cc5bc9f7c36b872483dddf4f472
          cd flutter
          flutter pub get
          flutter build web --release
          cd ../..
          mkdir -p resources/web2
          cp -R rustdesk-web-v2/build/web/. resources/web2/

      - name: Build administration frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p resources/admin
          cp -R frontend/dist/. resources/admin/

      - name: Build application bundle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/swaggo/swag/cmd/swag@latest
          swag --version
          chmod +x build.sh
          CGO_ENABLED=1 CC=musl-gcc CGO_LDFLAGS="-static" ./build.sh
          mkdir -p amd64
          cp -R release amd64/release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          build-args: |
            BUILDARCH=amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
