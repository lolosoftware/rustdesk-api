version: "3.9"

services:
  rustdesk-api:
    image: ${DOCKER_IMAGE:-lolosoftware/rustdesk-api:latest}
    container_name: rustdesk-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      RUSTDESK_API_LANG: ${RUSTDESK_API_LANG:-fr}
      RUSTDESK_API_APP_WEB_CLIENT: ${RUSTDESK_API_APP_WEB_CLIENT:-1}
      RUSTDESK_API_APP_REGISTER: ${RUSTDESK_API_APP_REGISTER:-false}
      RUSTDESK_API_APP_REGISTER_STATUS: ${RUSTDESK_API_APP_REGISTER_STATUS:-1}
      RUSTDESK_API_APP_SHOW_SWAGGER: ${RUSTDESK_API_APP_SHOW_SWAGGER:-0}
      RUSTDESK_API_APP_TOKEN_EXPIRE: ${RUSTDESK_API_APP_TOKEN_EXPIRE:-168h}
      RUSTDESK_API_APP_DISABLE_PWD_LOGIN: ${RUSTDESK_API_APP_DISABLE_PWD_LOGIN:-false}
      RUSTDESK_API_APP_CAPTCHA_THRESHOLD: ${RUSTDESK_API_APP_CAPTCHA_THRESHOLD:-3}
      RUSTDESK_API_APP_BAN_THRESHOLD: ${RUSTDESK_API_APP_BAN_THRESHOLD:-0}
      RUSTDESK_API_GIN_TRUST_PROXY: ${RUSTDESK_API_GIN_TRUST_PROXY:-}
      RUSTDESK_API_GORM_TYPE: ${RUSTDESK_API_GORM_TYPE:-sqlite}
      RUSTDESK_API_GORM_MAX_IDLE_CONNS: ${RUSTDESK_API_GORM_MAX_IDLE_CONNS:-10}
      RUSTDESK_API_GORM_MAX_OPEN_CONNS: ${RUSTDESK_API_GORM_MAX_OPEN_CONNS:-100}
      RUSTDESK_API_RUSTDESK_PERSONAL: ${RUSTDESK_API_RUSTDESK_PERSONAL:-1}
      RUSTDESK_API_MYSQL_USERNAME: ${RUSTDESK_API_MYSQL_USERNAME:-}
      RUSTDESK_API_MYSQL_PASSWORD: ${RUSTDESK_API_MYSQL_PASSWORD:-}
      RUSTDESK_API_MYSQL_ADDR: ${RUSTDESK_API_MYSQL_ADDR:-}
      RUSTDESK_API_MYSQL_DBNAME: ${RUSTDESK_API_MYSQL_DBNAME:-}
      RUSTDESK_API_MYSQL_TLS: ${RUSTDESK_API_MYSQL_TLS:-false}
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_API_RUSTDESK_ID_SERVER:-192.168.1.66:21116}
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_API_RUSTDESK_RELAY_SERVER:-192.168.1.66:21117}
      RUSTDESK_API_RUSTDESK_API_SERVER: ${RUSTDESK_API_RUSTDESK_API_SERVER:-http://127.0.0.1:21114}
      RUSTDESK_API_RUSTDESK_KEY: ${RUSTDESK_API_RUSTDESK_KEY:-}
      RUSTDESK_API_RUSTDESK_KEY_FILE: ${RUSTDESK_API_RUSTDESK_KEY_FILE:-/app/conf/data/id_ed25519.pub}
      RUSTDESK_API_RUSTDESK_WS_HOST: ${RUSTDESK_API_RUSTDESK_WS_HOST:-}
      RUSTDESK_API_RUSTDESK_WEBCLIENT_MAGIC_QUERYONLINE: ${RUSTDESK_API_RUSTDESK_WEBCLIENT_MAGIC_QUERYONLINE:-0}
      RUSTDESK_API_PROXY_ENABLE: ${RUSTDESK_API_PROXY_ENABLE:-false}
      RUSTDESK_API_PROXY_HOST: ${RUSTDESK_API_PROXY_HOST:-http://127.0.0.1:1080}
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY:-}
      RUSTDESK_API_JWT_EXPIRE_DURATION: ${RUSTDESK_API_JWT_EXPIRE_DURATION:-168h}
    ports:
      - "21114:21114"
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./conf:/app/conf:ro
      - ./resources:/app/resources:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:21114/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
