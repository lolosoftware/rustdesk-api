services:
  rustdesk-api:
    image: ghcr.io/lolosoftware/rustdesk-api:latest
    # image: ghcr.io/lolosoftware/rustdesk-api:v1.2.3
    container_name: rustdesk-api
    environment:
      - TZ=Asia/Shanghai
      - RUSTDESK_API_RUSTDESK_ID_SERVER=192.168.1.66:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=192.168.1.66:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://127.0.0.1:21114
      - RUSTDESK_API_RUSTDESK_KEY=123456789
      # - RUSTDESK_API_RUSTDESK_AUTO_ADD_ADDRESS_BOOK_COLLECTION_ID=1
    ports:
      - 21114:21114
    volumes:
      - ./data/rustdesk/api:/app/data # database
      # - ./conf:/app/conf # config
      # - ./resources:/app/resources # 静态资源
    restart: unless-stopped
