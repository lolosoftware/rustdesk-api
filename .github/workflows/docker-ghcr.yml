name: Build and publish Docker image to GHCR

on:
  push:
    branches:
      - master
      - prod-safe
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lolosoftware/rustdesk-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build administration frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high
          npm run build
          cd ..
          mkdir -p resources/admin
          cp -R frontend/dist/. resources/admin/

      - name: Build embedded web client bridge
        shell: bash
        run: |
          cd resources/web/js
          npm ci
          npm run build
          cd ../../..
          for file in resources/web/js/dist/*; do
            relative_path="${file#resources/web/}"
            content_hash="$(md5sum "$file" | cut -d ' ' -f 1)"
            sed -i -E "/\"${relative_path}\":/s/[a-f0-9]{32}/${content_hash}/" resources/web/flutter_service_worker.js
            grep -Fq "\"${relative_path}\": \"${content_hash}\"" resources/web/flutter_service_worker.js
          done

      - name: Build application bundle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/swaggo/swag/cmd/swag@latest
          swag --version
          chmod +x build.sh
          CGO_ENABLED=1 CC=musl-gcc CGO_LDFLAGS="-static" ./build.sh
          mkdir -p amd64
          cp -R release amd64/release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          build-args: |
            BUILDARCH=amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
